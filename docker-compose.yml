name: bpf-bbm-system

services:
  db:
    image: mariadb:10.11
    container_name: bbm_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: password_db
      MYSQL_DATABASE: bpf_asset_system
      MYSQL_USER: bpf_user
      MYSQL_PASSWORD: bpf_pass
      TZ: Asia/Jakarta
    ports:
      - "3307:3306"
    volumes:
      - bbm_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bpf_user", "-pbpf_pass"]
      timeout: 10s
      retries: 5
    networks:
      - default

  web:
    build: .
    container_name: bbm_web
    ports:
      - "5001:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
      - ./data/news_scraper:/app/data/news_scraper
      - ./fonts:/app/fonts
    environment:
      - FLASK_DEBUG=0
      - TZ=Asia/Jakarta
      - DB_HOST=db
      - DB_USER=bpf_user
      - DB_PASSWORD=bpf_pass
      - DB_NAME=bpf_asset_system
      - DB_POOL_SIZE=15
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY wajib di .env}
      - REDIS_URL=redis://redis:6379/0
      - DEPOT_LAT=-7.2657205
      - DEPOT_LNG=112.7448072
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  # ------------------------------------------------------------
  # NGINX — Reverse proxy untuk HTTPS (port 5000)
  # ------------------------------------------------------------
  # Menggunakan self-signed certificate untuk development.
  # Untuk production: ganti dengan certbot/Let's Encrypt.
  # Lihat DEPLOY_FRESH.md untuk instruksi SSL setup.
  nginx:
    image: nginx:stable-alpine
    container_name: bbm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: bbm_redis
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - bbm_redis_data:/data

  # ------------------------------------------------------------
  # BACKUP DB OTOMATIS (v2.21)
  # ------------------------------------------------------------
  backup:
    image: mariadb:10.11
    container_name: bbm_backup
    environment:
      - TZ=Asia/Jakarta
      - MYSQL_HOST=db
      - MYSQL_ROOT_PASSWORD=password_db
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_CRON=0 3 * * *
    volumes:
      - bbm_backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: |
      /bin/sh -c "chmod +x /usr/local/bin/backup-db.sh && \
      echo "$${BACKUP_CRON} /bin/sh /usr/local/bin/backup-db.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root && \
      echo 'Backup service siap — cron:' && cat /etc/crontabs/root && \
      crond -f -l 2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

volumes:
  bbm_db_data:
  bbm_redis_data:
  bbm_backups:

networks:
  default:
