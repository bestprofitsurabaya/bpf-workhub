name: bpf-workhub

services:
  db:
    image: mariadb:10.11
    container_name: bpf-workhub-db
    environment:
      # v2.30: kredensial dibaca dari .env (JANGAN hardcode di repo).
      # Hanya berlaku saat volume DB pertama kali dibuat; rotasi kredensial
      # DB yang sudah ada harus via ALTER USER (scripts/rotate-db-credentials.sh).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib di .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bpf_asset_system}
      MYSQL_USER: ${MYSQL_USER:-bpf_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib di .env}
      TZ: Asia/Jakarta
    ports:
      # v2.29: bind localhost saja — DB tidak boleh terbuka ke internet.
      # Akses admin dari host tetap bisa via 127.0.0.1:3307.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 256m
    # v2.29: max_connections dinaikkan dari default 151 → 500. Pool BPF
    # (15-25 koneksi × 10 DB) + koneksi fallback sebelumnya menembus 151
    # (Max_used_connections=152) → "Pool exhausted" di log aplikasi.
    command: --max-connections=500
    healthcheck:
      # Password tidak di-hardcode — baca dari env container (MYSQL_USER/MYSQL_PASSWORD)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - default

  web:
    build: .
    container_name: bpf-workhub-web
    ports:
      # v2.29: bind localhost saja. HTTPS publik dilayani nextcloud_nginx
      # (container network), bukan port host. Akses dev via SSH tunnel.
      - "127.0.0.1:5001:5000"
    volumes:
      # v2.47: data UPLOAD PENGGUNA dipindah ke disk besar /srv (1.7 TB) agar
      # tidak menggerus disk root (92 GB). Path ABSOLUT host — folder sumber
      # dibuat otomatis oleh Docker bila belum ada.
      - /srv/bpf-workhub/uploads:/app/uploads
      # v2.29: bind ./static DIHAPUS — dulu menimpa SPA hasil build image,
      # padahal static/app tidak di-commit (gitignore) → fresh deploy SPA rusak.
      # SPA kini murni dari Dockerfile (stage frontend-build), selalu sinkron
      # dengan source frontend/ saat image di-build.
      # Catatan: news_scraper TETAP di repo (5,9 MB, berisi file yang di-commit).
      - ./data/news_scraper:/app/data/news_scraper
      # v2.46.0: hasil transcoder (persisten, di luar image) — v2.47 pindah /srv
      - /srv/bpf-workhub/data/transcoder:/app/data/transcoder
      # v2.51.0: arsip Berita Acara Rekonsiliasi Subsidi Tepat (PDF + snapshot
      # JSON bukti hash) WAJIB persisten — dokumen resmi kantor pusat
      - /srv/bpf-workhub/data/subsidy_attest:/app/data/subsidy_attest
      - ./fonts:/app/fonts
      # v2.48.0: PWA mobile — bind mount supaya edit file tidak perlu rebuild image
      - ./mobile:/app/mobile:ro
      # v2.98.0: guard deploy — versi repo (CHANGELOG) dibandingkan dengan versi
      # image. Bila repo lebih baru, request non-health ditolak 503 sampai rebuild.
      - ./CHANGELOG.md:/app/deploy/CHANGELOG.md:ro
      # v2.69.0: gate OTP agen Subsidi Tepat — endpoint /api/subsidy/otp/*
      # menulis perintah di sini; supervisor di HOST (otp_supervisor.mjs)
      # mengeksekusi login/verify/pull & menulis balik agent_state.json
      - ./agent/subsiditepat/gate:/app/subsidy_gate
    environment:
      - FLASK_DEBUG=0
      - TZ=Asia/Jakarta
      # block = tolak request saat image tertinggal; warn = hanya log; off = mati
      - DEPLOY_GUARD=${DEPLOY_GUARD:-block}
      - DB_HOST=db
      - DB_USER=${DB_USER:-bpf_user}
      # Password dari .env (satu sumber: MYSQL_PASSWORD untuk user aplikasi)
      - DB_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib di .env}
      - DB_NAME=${DB_NAME:-bpf_asset_system}
      - DB_POOL_SIZE=25
      # Cabang: pool kecil (5) — master sibuk, cabang sepi. Pool mysql.connector
      # membuka semua koneksi saat init → 25×10 DB = 250 koneksi idle di host
      # 3.8GB. Master 25 + 9 cabang × 5 = 70 koneksi maksimal.
      - BRANCH_POOL_SIZE=5
      # Retry singkat saat pool penuh (menghindari koneksi non-pool baru)
      - DB_POOL_RETRIES=3
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY wajib di .env}
      # Secure cookie: WAJIB true jika diakses via HTTPS (produksi). Jika ada
      # user mengakses via http://IP:5001 di LAN, cookie tidak akan dikirim
      # browser -> login loop. Matikan hanya untuk dev http lokal.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - REDIS_URL=redis://redis:6379/0
      - SCRAPER_LOG_LEVEL=${SCRAPER_LOG_LEVEL:-INFO}
      # Titik awal rute appointment (kantor): PT Bestprofit Futures Cab. Surabaya
      # Graha Bukopin Lantai 11, Jl. Panglima Sudirman No. 10-18, Surabaya 60271
      - DEPOT_LAT=-7.2657205
      - DEPOT_LNG=112.7448072
      # v2.50.0: token impor data Subsidi Tepat (agen host → /api/subsidy/import)
      - SUBSIDY_IMPORT_TOKEN=${SUBSIDY_IMPORT_TOKEN:-}
      # v2.78.0: Inventaris IT — token agen discovery (host/WMI → /api/it/discovery/agent)
      # dan basis URL publik yang ditanam di QR label (opsional; default host request).
      - IT_DISCOVERY_TOKEN=${IT_DISCOVERY_TOKEN:-}
      - IT_ASSET_PUBLIC_BASE=${IT_ASSET_PUBLIC_BASE:-}
      - IT_DISCOVERY_SUBNETS=${IT_DISCOVERY_SUBNETS:-192.168.2.0/23}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Server bersama (3.8GB total + Nextcloud & project lain) — batasi agar
    # satu container tidak menghabiskan RAM host. v2.46.0: dinaikkan dari 1g —
    # ffmpeg transcode butuh headroom (antrean MAX_CONCURRENT=1 di engine).
    mem_limit: 1536m
    mem_reservation: 256m
    # v2.46.6: fallback DNS publik — resolver utama NAS (172.60.199.1, DNS
    # internal) sesekali gagal resolve domain luar (mis. www.newsmaker.id,
    # 2026-09-30 07:01 UTC) sehingga run auto-scrape abort. Docker meneruskan
    # SEMUA server ini ke container; gagal satu, resolver client coba berikutnya.
    dns:
      - 172.60.199.1     # DNS internal (resolusi host/servis lokal tetap jalan)
      - 1.1.1.1          # Cloudflare (fallback publik)
      - 8.8.8.8          # Google (fallback publik)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - default            # Terhubung ke bpf-workhub-db
      - nextcloud_net      # Terhubung ke nextcloud_nginx (HTTPS proxy)

  redis:
    image: redis:7-alpine
    container_name: bpf-workhub-redis
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # ------------------------------------------------------------
  # BACKUP DB OTOMATIS (v2.21)
  # ------------------------------------------------------------
  backup:
    image: mariadb:10.11
    container_name: bpf-workhub-backup
    environment:
      - TZ=Asia/Jakarta
      - MYSQL_HOST=db
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib di .env}
      - BACKUP_RETENTION_DAYS=30
      - BACKUP_CRON=0 3 * * *
      # v2.49.2: monitoring backup via Uptime Kuma (opsional, isi di .env).
      # BACKUP_KUMA_HEARTBEAT = URL push monitor → di-curl tiap backup OK
      # BACKUP_KUMA_ALERT_URL = URL push monitor → di-curl bila check gagal
      - BACKUP_KUMA_HEARTBEAT=${BACKUP_KUMA_HEARTBEAT:-}
      # Juga dipakai oleh backup-freshness-check.sh (umur file terbaru):
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-30}
      # v2.49.2: drill restore otomatis mingguan (2 field "menit jam").
      # Default 0 4 = Minggu 04:00 WIB. Bisa dimatikan dgn nilai "off".
      - RESTORE_TEST_CRON=${RESTORE_TEST_CRON:-0 4 * * 0}
    volumes:
      - backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ./scripts/backup-freshness-check.sh:/usr/local/bin/backup-freshness-check.sh:ro
      - ./scripts/restore-test.sh:/usr/local/bin/restore-test.sh:ro
    # Image mariadb:10.11 (Debian) TIDAK punya crond — pakai loop scheduler.
    # Jam jalan dibaca dari 2 field pertama BACKUP_CRON (default 0 3 = 03:00).
    entrypoint: |
      /bin/sh -c 'M=$$(echo $${BACKUP_CRON} | awk "{print \$1}"); \
      H=$$(echo $${BACKUP_CRON} | awk "{print \$2}"); \
      RT=$${RESTORE_TEST_CRON:-0 4 * * 0}; \
      echo "Backup scheduler siap — jalan tiap hari jam $$H:$$(printf %02d $$M) (retensi $${BACKUP_RETENTION_DAYS} hari)"; \
      if [ "$$RT" != "off" ]; then \
        RM=$$(echo $$RT | awk "{print \$1}"); RH=$$(echo $$RT | awk "{print \$2}"); \
        echo "Restore drill mingguan: jam $$RH:$$(printf %02d $$RM) (RESTORE_TEST_CRON=$$RT)"; \
      fi; \
      while :; do \
        now=$$(date +%s); t=$$(date -d "today $$H:$$M" +%s); \
        [ "$$t" -le "$$now" ] && t=$$(date -d "tomorrow $$H:$$M" +%s); \
        sleep $$((t - now)); \
        echo "[scheduler] mulai backup $$(date -Iseconds)"; \
        /bin/sh /usr/local/bin/backup-db.sh >> /var/log/backup.log 2>&1 || echo "[scheduler] backup GAGAL — cek /var/log/backup.log"; \
        if [ "$$RT" != "off" ] && [ "$$(date +%u)" = "7" ]; then \
          echo "[scheduler] drill restore Minggu $$(date -Iseconds)"; \
          /bin/sh /usr/local/bin/restore-test.sh >> /var/log/backup.log 2>&1 || echo "[scheduler] drill restore GAGAL — cek /var/log/backup.log"; \
        fi; \
      done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

# v2.53.1: nama volume EKSPLISIT pola bpf-workhub (tidak ikut prefix nama
# project compose) — sebelumnya bpf-bbm-system_bbm_* yang membingungkan.
# Data volume lama dimigrasi 1:1 saat standardisasi (copy file, bukan dump
# ulang) sehingga tidak ada kehilangan data.
volumes:
  db_data:
    name: bpf-workhub_db_data
  redis_data:
    name: bpf-workhub_redis_data
  backups:
    name: bpf-workhub_backups

networks:
  default:
  # Network bersama dengan Nextcloud — biarkan aktif jika hybrid server.
  # Untuk server dedicated BPF saja, hapus baris di bawah.
  nextcloud_net:
    external: true
    name: nextcloud_net
