server {
    listen 5000 ssl;
    server_name nasbpfsby.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/nasbpfsby.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasbpfsby.duckdns.org/privkey.pem;

    resolver 127.0.0.11 valid=30s;

    # ============================================
    # 1. Assets dengan hash (JS/CSS Vite) → cache 1 tahun
    # ============================================
    location ~* ^/app/assets/.*\.(js|css|woff2?|ttf|eot|svg)$ {
        set $upstream_bbm http://bbm_web:5000;
        proxy_pass $upstream_bbm;

        # Hapus header Cache-Control dari Flask, set sendiri
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 2. index.html + entry files → NO CACHE
    # ============================================
    location ~* ^/app/(index\.html|dark-init\.js|sw\.js|manifest\.webmanifest)$ {
        set $upstream_bbm http://bbm_web:5000;
        proxy_pass $upstream_bbm;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 3. Static files (icon, logo) → cache 30 hari
    # ============================================
    location ~* ^/static/ {
        set $upstream_bbm http://bbm_web:5000;
        proxy_pass $upstream_bbm;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # 4. Semua route lain → NO CACHE (SPA routes)
    # ============================================
    location / {
        set $upstream_bbm http://bbm_web:5000;
        proxy_pass $upstream_bbm;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # WebSocket / Socket.IO
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
