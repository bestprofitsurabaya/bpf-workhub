# ============================================================
# BPF WorkHub — jembatan aplikasi Cordova lama (bpf-calendar)
# ============================================================
# Dipublikasikan di https://nasbpfsby.duckdns.org:8444
# Naikkan ke WorkHub; endpoint read-only yang dipertahankan:
#   /api/state, /api/month, /api/stream, /assets/up/*, /assets/logo.png
#
# Pasang di host NAS:
#   cp nginx/bpf-calendar-bridge.conf ~/hybrid_nextcloud/nginx/conf.d/bpf-calendar.conf
#   docker restart nextcloud_nginx
#
# Rollback: kembalikan upstream ke http://bpf-calendar:3000.
# ============================================================

server {
    listen 8444 ssl;
    server_name nasbpfsby.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/nasbpfsby.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasbpfsby.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Keamanan: hanya izinkan Host = domain (anti-scan bot)
    if ($host !~ ^nasbpfsby\.duckdns\.org$) {
        return 444;
    }

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=30s;

    # Hanya jalur bridge — jangan pernah membuka SPA/admin lewat port ini.
    location ~ ^/(api/(state|month|stream)$|assets/) {
        set $upstream_workhub http://bpf-workhub-web:5000;
        proxy_pass $upstream_workhub;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / realtime: jangan buffer, jangan gzip, timeout panjang.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        return 404;
    }
}
