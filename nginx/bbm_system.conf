# ============================================================
# BPF WorkHub — nginx reverse proxy config
# ============================================================
# Copy file ini ke:
#   ~/hybrid_nextcloud/nginx/conf.d/bbm_system.conf
#
# Lalu restart nginx:
#   docker restart nextcloud_nginx
#
# Untuk fresh deploy tanpa Nextcloud, gunakan nginx.conf standalone.
# Lihat DEPLOY_FRESH.md untuk instruksi lengkap.
# ============================================================

server {
    listen 5000 ssl;
    server_name nasbpfsby.duckdns.org;

    # SSL certificates (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/nasbpfsby.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nasbpfsby.duckdns.org/privkey.pem;

    # DNS Resolver internal milik Docker
    resolver 127.0.0.11 valid=30s;

    location / {
        # Variabel untuk mencegah Nginx crash jika bbm_web mati/telat
        set $upstream_bbm http://bbm_web:5000;
        proxy_pass $upstream_bbm;

        # WebSocket / Socket.IO (notifikasi real-time driver)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
