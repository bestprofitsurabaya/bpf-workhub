name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Vue SPA build + unit test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Audit keamanan dependensi frontend (Tahap 4/6 ISO 27001 — A.8.8).
      # Gagal bila ada vuln high/critical (semua devDependencies, tidak
      # ikut ke bundle produksi).
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Kredensial CI sengaja beda dari produksi (throwaway per-run)
          MARIADB_ROOT_PASSWORD: ci_root_pass_x9
          MARIADB_DATABASE: bpf_asset_system
          MARIADB_USER: bpf_user
          MARIADB_PASSWORD: ci_app_pass_x9
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pass_x9"
          --health-interval 5s --health-timeout 5s --health-retries 15 --health-start-period 20s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      SESSION_COOKIE_SECURE: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: bpf_user
      DB_PASSWORD: ci_app_pass_x9
      DB_NAME: bpf_asset_system
      DB_POOL_SIZE: '2'
      BRANCH_POOL_SIZE: '1'
      DB_POOL_RETRIES: '1'
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils mariadb-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Audit keamanan dependensi backend (Tahap 4/6 ISO 27001 — A.8.8).
      # Gagal bila ada vuln diketahui pada versi ter-pin di requirements.txt.
      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt
      # Konsistensi 7 titik stamp versi (v2.40.3) — bump yang lupa menyentuh
      # satu titik gagal di sini SEBELUM deploy (insiden revert stamp cabang).
      - name: Check version stamps
        run: python scripts/check_version_stamps.py
      # Konsistensi peta cabang→DB (v2.40.3): seed init.sql sesuai konvensi
      # (SBY = master, lainnya bpf_branch_<x>) + anti-hardcode literal nama DB
      # di kode aplikasi — peta hanya boleh lewat branches.db_name.
      - name: Check branch DB map
        run: python scripts/check_branch_db_map.py
      # Service MariaDB CI start dengan DB kosong — seed dari init.sql supaya
      # pytest & schema drift check melihat skema yang sama dengan deploy fresh.
      - name: Seed master DB from init.sql
        run: mariadb -h 127.0.0.1 -u bpf_user -pci_app_pass_x9 bpf_asset_system < init.sql
      - name: Run tests (unit, DB service tersedia)
        run: python -m pytest tests/ -q
      - name: Check schema drift
        run: python scripts/check_schema_drift.py

  # E2E alur kritis driver → GA → Finance. Berjalan pada Flask lokal yang
  # di-seed dengan data uji oleh scripts/ci_e2e.sh — TIDAK pernah ke produksi.
  e2e:
    name: E2E (Playwright alur kritis)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pass_x9
          MARIADB_DATABASE: bpf_asset_system
          MARIADB_USER: bpf_user
          MARIADB_PASSWORD: ci_app_pass_x9
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -u root -pci_root_pass_x9"
          --health-interval 5s --health-timeout 5s --health-retries 15 --health-start-period 20s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      SESSION_COOKIE_SECURE: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: bpf_user
      DB_PASSWORD: ci_app_pass_x9
      DB_NAME: bpf_asset_system
      DB_POOL_SIZE: '2'
      BRANCH_POOL_SIZE: '1'
      DB_POOL_RETRIES: '1'
      REDIS_URL: redis://127.0.0.1:6379/0
      E2E_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E (Flask lokal + DB uji)
        run: bash scripts/ci_e2e.sh

  image-scan:
    name: Image security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t bpf-workhub:ci .
      # Scan image container (Tahap 4/6 ISO 27001 — A.8.8). Gagal bila ada
      # vuln HIGH/CRITICAL yang sudah punya fix. --ignore-unfixed: CVE OS
      # base image tanpa upstream fix tidak menggagalkan build (tidak ada
      # aksi yang bisa diambil).
      - name: Trivy scan (HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            bpf-workhub:ci
