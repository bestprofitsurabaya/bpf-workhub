<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://nasbpfsby.duckdns.org:8444 https://nasbpfsby.duckdns.org https://i.ytimg.com data:; media-src 'self' https://nasbpfsby.duckdns.org:8444 https://nasbpfsby.duckdns.org; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https://nasbpfsby.duckdns.org:8444;">
<title>BPF Agenda</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- overlay pilih kategori user via PIN (2 user: BO & Marketing) -->
<div id="catScreen" class="cat-screen hidden">
  <div class="cat-card">
    <img class="cat-logo" src="" alt="BPF" id="catLogo">
    <h1>Selamat datang di<br>BPF Agenda</h1>
    <p class="muted">Masukkan PIN untuk masuk ke agenda.</p>
    <form id="catPinForm" class="cat-pin-form" autocomplete="off">
      <input type="password" id="catPin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" />
      <button type="submit" class="cat-btn cat-primary">Masuk</button>
    </form>
    <p id="catHint" class="error"></p>
    <p class="hint">Masukkan PIN 6 digit untuk masuk ke agenda.</p>
  </div>
</div>

<!-- overlay viewer gambar (tap gambar untuk memperbesar) -->
<div id="viewer" class="viewer hidden">
  <img id="viewerImg" alt="">
  <button id="viewerClose" class="viewer-close">✕</button>
</div>

<!-- banner pembaruan APK (v2.125.0) -->
<div id="updBar" class="upd-bar hidden" role="status" aria-live="polite">
  <div class="upd-card">
    <div class="upd-head"><span class="upd-icon">⬆</span><strong id="updTitle">Pembaruan tersedia</strong></div>
    <p id="updText" class="upd-text"></p>
    <p id="updNotes" class="upd-notes hidden"></p>
    <div class="upd-actions">
      <button id="updInstall" class="upd-btn upd-primary">Unduh &amp; pasang</button>
      <button id="updSkip" class="upd-btn">Nanti</button>
    </div>
  </div>
</div>

<main class="app">

  <!-- kiri: kalender -->
  <section class="pane pane-left">
    <header class="app-head">
      <span class="logo-chip"><img id="logo" src="" alt=""></span>
      <div class="head-text">
        <span class="company">BestProfit</span>
        <span class="tagline">Kalender Agenda</span>
      </div>
      <div class="head-actions">
        <span id="liveBadge" class="live-badge">…</span>
        <span id="catChip" class="cat-chip" title="Kategori aktif">…</span>
        <button id="catBtn" class="iconbtn" title="Ganti kategori">👥</button>
        <button id="widgetBtn" class="iconbtn" title="Widget home screen">📲</button>
        <button id="updBtn" class="iconbtn" title="Cek pembaruan aplikasi">⬆</button>
        <button id="themeBtn" class="iconbtn" title="Tema gelap/terang">☀</button>
      </div>
    </header>

    <div class="month-nav">
      <button id="prevMonth" class="navbtn">‹</button>
      <h2 id="monthLabel">—</h2>
      <button id="nextMonth" class="navbtn">›</button>
    </div>

    <!-- tiga pane: bulan sebelumnya | bulan aktif | bulan berikutnya.
         Saat swipe, track bergeser sehingga bulan tetangga ikut terlihat. -->
    <div id="calViewport" class="cal-viewport">
      <div id="calTrack" class="cal-track">
        <div id="calPrev" class="calendar" aria-hidden="true"></div>
        <div id="calendar" class="calendar"></div>
        <div id="calNext" class="calendar" aria-hidden="true"></div>
      </div>
    </div>
    <div class="app-foot"><span id="updatedAt"></span></div>
  </section>

</main>

<!-- popup agenda hari (muncul saat tanggal diklik) -->
<div id="dayModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="detailDate">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">
        <h2 id="detailDate">—</h2>
        <p id="detailMeta" class="detail-meta"></p>
      </div>
      <button id="dayClose" class="modal-close" aria-label="Tutup">✕</button>
    </div>
    <div id="agenda" class="agenda modal-body">
      <div class="agenda-item">
        <span class="muted">Memuat…</span>
      </div>
    </div>
  </div>
</div>

<script src="cordova.js"></script>
<script src="js/hari-libur.js"></script>
<script src="js/kalender-jawa.js"></script>
<script src="js/config.js"></script>
<script src="js/updater.js"></script>
<script src="js/app.js"></script>
</body>
</html>
