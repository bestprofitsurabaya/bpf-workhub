<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://nasbpfsby.duckdns.org:8444 https://nasbpfsby.duckdns.org https://i.ytimg.com data:; media-src 'self' https://nasbpfsby.duckdns.org:8444 https://nasbpfsby.duckdns.org; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://nasbpfsby.duckdns.org:8444;">
<title>BPF Agenda</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- overlay pilih kategori user via PIN (2 user: BO & Marketing) -->
<div id="catScreen" class="cat-screen hidden">
  <div class="cat-card">
    <img class="cat-logo" src="" alt="BPF" id="catLogo">
    <h1>Masuk ke Agenda</h1>
    <p class="muted">Masukkan PIN untuk melihat agenda sesuai kategori Anda.</p>
    <form id="catPinForm" class="cat-pin-form" autocomplete="off">
      <input type="password" id="catPin" inputmode="numeric" maxlength="6"
             placeholder="••••••" autocomplete="off" aria-label="PIN 6 digit" />
      <button type="submit" class="cat-primary">Masuk</button>
    </form>
    <p id="catHint" class="error"></p>
    <p class="hint">PIN 6 digit diberikan oleh admin kantor.</p>
  </div>
</div>

<!-- viewer gambar (tap gambar untuk memperbesar) -->
<div id="viewer" class="viewer hidden">
  <img id="viewerImg" alt="">
  <button id="viewerClose" class="viewer-close" aria-label="Tutup gambar">✕</button>
</div>

<!-- banner pembaruan APK -->
<div id="updBar" class="upd-bar hidden" role="status" aria-live="polite">
  <div class="upd-card">
    <div class="upd-head"><span class="upd-icon">⬆</span><strong id="updTitle">Pembaruan tersedia</strong></div>
    <p id="updText" class="upd-text"></p>
    <p id="updNotes" class="upd-notes hidden"></p>
    <div class="upd-actions">
      <button id="updInstall" class="upd-btn upd-primary">Unduh &amp; pasang</button>
      <button id="updSkip" class="upd-btn">Nanti</button>
    </div>
  </div>
</div>

<div class="app">

  <header class="app-head">
    <div class="brand">
      <span class="logo-chip"><img id="logo" src="" alt="BestProfit"></span>
      <div class="head-text">
        <span class="company">BPF Agenda</span>
        <span class="tagline">BestProfit Futures</span>
      </div>
    </div>

    <div class="head-actions">
      <span id="liveBadge" class="live-badge"><span class="live-dot"></span><span class="live-text">…</span></span>
      <span id="catChip" class="cat-chip" title="Kategori aktif"><span class="cat-full">…</span><span class="cat-short">…</span></span>
      <button id="todayBtn" class="today-btn" title="Kembali ke hari ini">
        <span class="today-ico">◉</span><span class="today-text">Hari ini</span>
      </button>
      <div class="menu-wrap">
        <button id="menuBtn" class="iconbtn" aria-haspopup="menu" aria-expanded="false"
                aria-label="Menu lainnya">⋯</button>
        <div id="menuSheet" class="menu-sheet hidden" role="menu">
          <button id="menuCat" class="menu-item" role="menuitem"><span class="mi-ico">👥</span> Ganti kategori</button>
          <button id="menuWidget" class="menu-item" role="menuitem"><span class="mi-ico">📲</span> Widget beranda</button>
          <button id="menuTheme" class="menu-item" role="menuitem"><span class="mi-ico">🌓</span> <span id="menuThemeLabel">Mode terang</span></button>
          <button id="menuUpdate" class="menu-item" role="menuitem"><span class="mi-ico">⬆</span> Cek pembaruan</button>
          <div class="menu-sep"></div>
          <div class="menu-meta" id="menuVersion">BPF Agenda</div>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">

    <section class="cal-pane">
      <div class="month-nav">
        <button id="prevMonth" class="navbtn" aria-label="Bulan sebelumnya">‹</button>
        <h2 id="monthLabel">—</h2>
        <button id="nextMonth" class="navbtn" aria-label="Bulan berikutnya">›</button>
      </div>

      <!-- tiga pane: bulan sebelumnya | bulan aktif | bulan berikutnya.
           Saat swipe, track bergeser sehingga bulan tetangga ikut terlihat. -->
      <div id="calViewport" class="cal-viewport">
        <div id="calTrack" class="cal-track">
          <div id="calPrev" class="calendar" aria-hidden="true"></div>
          <div id="calendar" class="calendar"></div>
          <div id="calNext" class="calendar" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <aside id="agendaPane" class="agenda-pane" aria-live="polite">
      <div class="agenda-head">
        <div class="agenda-top">
          <p class="agenda-kicker">Agenda</p>
          <span id="agendaCount" class="count-pill">—</span>
        </div>
        <h2 id="detailDate">—</h2>
        <p id="detailMeta" class="detail-meta"></p>
      </div>
      <div id="agenda" class="agenda">
        <div class="agenda-item empty">
          <span class="empty-ico">🗓️</span>
          <strong>Pilih tanggal</strong>
          <span class="muted">Agenda hari itu akan tampil di sini.</span>
        </div>
      </div>
      <div class="pane-foot"><span id="updatedAt"></span></div>
    </aside>

  </main>
</div>

<script src="cordova.js"></script>
<script src="js/hari-libur.js"></script>
<script src="js/kalender-jawa.js"></script>
<script src="js/config.js"></script>
<script src="js/updater.js"></script>
<script src="js/app.js"></script>
</body>
</html>
